name: Conferir a conta e o token

# Use uma vez, depois de colar o segredo IG_TOKEN: mostra de qual perfil é o
# token e imprime o IG_USER_ID que deve virar o segredo IG_USER_ID.
on:
  workflow_dispatch:

jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: node scripts/conta.mjs
